blueprint:
  name: LG Camera Overlay - launch one camera on one TV
  description: Launch the installed TV overlay only while the chosen TV is already active. Create one script per TV/camera combination.
  domain: script
  author: MBS Integrations
  source_url: https://github.com/mbsintegrations/LG-Camera-Overlay/blob/main/blueprints/script/camera-overlay.yaml
  homeassistant:
    min_version: '2024.10.0'
  input:
    tv:
      name: LG TV
      selector:
        entity:
          filter:
            - domain: media_player
              integration: webostv
    stream:
      name: Private loopback stream URL
      description: 'ws://127.0.0.1:8766/live/YOUR_TOKEN/CAMERA_ID/TV_ID — treat as a secret; do not post traces publicly.'
      selector:
        text: {}
    label:
      name: Camera label
      default: Camera
      selector:
        text: {}
    duration:
      name: Total display duration
      default: 30
      selector:
        number:
          min: 15
          max: 90
          unit_of_measurement: seconds
    width:
      name: Panel width
      default: 42
      selector:
        number:
          min: 25
          max: 55
          unit_of_measurement: '%'
    position:
      name: Panel position
      default: top-right
      selector:
        select:
          options:
            - label: Top right
              value: top-right
            - label: Top left
              value: top-left
            - label: Bottom right
              value: bottom-right
            - label: Bottom left
              value: bottom-left
            - label: Centre
              value: center
    margin:
      name: Distance from the screen edge
      description: Ignored for the centre position.
      default: 3
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: '% of screen width'
    border:
      name: Show border
      description: Draw a border around the panel.
      default: true
      selector:
        boolean: {}
    borderColor:
      name: Border colour
      description: Border colour as '#rrggbb'.
      default: '#67dfad'
      selector:
        text: {}
    fps:
      name: Show frame rate
      description: Show the frame rate next to LIVE.
      default: true
      selector:
        boolean: {}
    compact:
      name: Compact panel
      description: Show the title and countdown over the camera picture on a translucent background.
      default: false
      selector:
        boolean: {}
    app_id:
      name: Installed application ID
      default: com.mbs.cameraoverlay
      selector:
        text: {}
    dismiss_screensaver:
      name: Restore screen before showing the camera
      description: >-
        Optional screen-on command for an already-active TV. Dismisses the LG
        screensaver and may restore an intentionally blanked screen. Tested on
        OLED65B9PLA; verify on your model. Does not send HOME/BACK or change
        screensaver settings. Leave off to preserve existing behaviour.
      default: false
      selector:
        boolean: {}
mode: restart
variables:
  restore_screen: !input dismiss_screensaver
sequence:
  - condition: state
    entity_id: !input tv
    state: ['on', playing, paused, idle, buffering]
  - if:
      - condition: template
        value_template: '{{ restore_screen }}'
    then:
      - action: webostv.command
        target:
          entity_id: !input tv
        data:
          command: com.webos.service.tvpower/power/turnOnScreen
      - delay:
          milliseconds: 1500
  - condition: state
    entity_id: !input tv
    state: ['on', playing, paused, idle, buffering]
  - action: webostv.command
    target:
      entity_id: !input tv
    data:
      command: system.launcher/launch
      payload:
        id: !input app_id
        params:
          stream: !input stream
          label: !input label
          duration: !input duration
          width: !input width
          position: !input position
          margin: !input margin
          border: !input border
          borderColor: !input borderColor
          fps: !input fps
          compact: !input compact
          sentAt: '{{ (as_timestamp(now()) * 1000) | int }}'
