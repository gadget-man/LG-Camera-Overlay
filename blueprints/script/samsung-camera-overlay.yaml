blueprint:
  name: Samsung Camera Overlay - show one camera on one Tizen TV
  description: >-
    Tell the relay which camera to show, then make sure the overlay app is open on an already-on Samsung TV.
    The app keeps the chosen HDMI input full-screen and shows the camera as a picture-in-picture on top.
    If the app is already open it picks the request up within a second, with no relaunch and no black flash.
    Requires the rest_command snippets from docs/SAMSUNG-TIZEN.md (the 1.2.0 version, which passes the appearance settings).
  domain: script
  author: MBS Integrations
  source_url: https://github.com/gadget-man/LG-Camera-Overlay/blob/samsung-tizen/blueprints/script/samsung-camera-overlay.yaml
  homeassistant:
    min_version: '2024.10.0'
  input:
    tv:
      name: Samsung TV
      description: Nothing happens unless this TV is on.
      selector:
        entity:
          filter:
            - domain: media_player
              integration: samsungtv
    tv_id:
      name: Relay TV ID
      description: The TV's key under "tvs" in the relay's private/config.json, for example lounge.
      selector:
        text: {}
    camera:
      name: Relay camera ID
      description: The camera's key under "sources" in the relay's private/config.json, for example outside.
      selector:
        text: {}
    label:
      name: Camera label
      default: Camera
      selector:
        text: {}
    duration:
      name: Time on screen
      description: Counted from when the picture first appears on the TV, not from when the script runs.
      default: 20
      selector:
        number:
          min: 15
          max: 90
          unit_of_measurement: seconds
    width:
      name: Picture width
      description: Width of the picture-in-picture as a percentage of the screen.
      default: 25
      selector:
        number:
          min: 10
          max: 55
          unit_of_measurement: '%'
    position:
      name: Picture position
      default: top-right
      selector:
        select:
          options:
            - label: Top right
              value: top-right
            - label: Top left
              value: top-left
            - label: Bottom right
              value: bottom-right
            - label: Bottom left
              value: bottom-left
            - label: Centre
              value: center
    margin:
      name: Distance from the screen edge
      description: Ignored for the centre position.
      default: 3
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: '% of screen width'
    border:
      name: Show border
      default: true
      selector:
        boolean: {}
    borderColor:
      name: Border colour
      description: "Border colour as '#rrggbb'. Leave empty for the default translucent white."
      default: ''
      selector:
        text: {}
    compact:
      name: Show camera label
      description: Show the camera label over the top of the picture on a translucent strip (the LG app's compact mode).
      default: false
      selector:
        boolean: {}
    hdmi:
      name: HDMI input behind the picture
      description: 0 keeps whatever TV source the app finds.
      default: 1
      selector:
        number:
          min: 0
          max: 4
    app_id:
      name: Installed application ID
      default: MbsCamOvly.CameraOverlay
      selector:
        text: {}
    enabled_switch:
      name: On/off switch (optional)
      description: An input_boolean. When it is off, the script does nothing. Leave empty to always run.
      default: ''
      selector:
        entity:
          filter:
            - domain: input_boolean
    launch_with:
      name: How to open the TV app
      description: >-
        "TV network API" posts to the TV on port 8001 through rest_command.camera_overlay_launch
        (confirmed on a 2021 QN94A). "Samsung integration" uses media_player.play_media instead.
      default: rest_command
      selector:
        select:
          options:
            - label: TV network API (rest_command.camera_overlay_launch)
              value: rest_command
            - label: Samsung integration (media_player.play_media)
              value: samsungtv
mode: single
max_exceeded: silent
variables:
  enabled: !input enabled_switch
  launch: !input launch_with
  shown_for: !input duration
sequence:
  - condition: template
    value_template: "{{ not enabled or is_state(enabled, 'on') }}"
  - condition: state
    entity_id: !input tv
    state: ['on', playing, paused, idle, buffering]
  - action: rest_command.camera_overlay_show
    data:
      tv_id: !input tv_id
      camera: !input camera
      label: !input label
      duration: !input duration
      width: !input width
      hdmi: !input hdmi
      position: !input position
      margin: !input margin
      border: !input border
      borderColor: !input borderColor
      compact: !input compact
  - choose:
      - conditions: "{{ launch == 'samsungtv' }}"
        sequence:
          - action: media_player.play_media
            continue_on_error: true
            target:
              entity_id: !input tv
            data:
              media_content_type: app
              media_content_id: !input app_id
    default:
      - action: rest_command.camera_overlay_launch
        continue_on_error: true
  # Ignore repeat triggers (motion, a second button press) while the picture starts up and shows.
  - delay:
      seconds: "{{ shown_for | int + 10 }}"
